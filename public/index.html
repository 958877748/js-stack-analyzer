<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS 堆栈解析器</title>
<style>
:root {
  --bg: #1e1e2e;
  --fg: #cdd6f4;
  --accent: #89b4fa;
  --border: #45475a;
  --line-bg: #181825;
  --highlight: #f9e2af;
  --error-fg: #f38ba8;
  --link: #89b4fa;
  --surface: #313244;
  --green: #a6e3a1;
  --muted: #6c7086;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
  background: var(--bg);
  color: var(--fg);
  font-size: 14px;
  min-height: 100vh;
}

/* ===== 输入页 ===== */
#inputPage {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}
.input-card {
  width: 100%;
  max-width: 900px;
  background: var(--surface);
  border-radius: 12px;
  padding: 32px;
  border: 1px solid var(--border);
}
.input-card h1 {
  font-size: 22px;
  color: var(--accent);
  margin-bottom: 8px;
}
.input-card .sub {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 20px;
}
.input-card textarea {
  width: 100%;
  height: 300px;
  background: var(--line-bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  font-family: inherit;
  font-size: 13px;
  resize: vertical;
  tab-size: 2;
  line-height: 1.6;
}
.input-card textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(137,180,250,0.2);
}
.btn-parse {
  margin-top: 16px;
  width: 100%;
  padding: 14px;
  font-size: 16px;
  font-weight: 700;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  transition: filter 0.15s;
}
.btn-parse:hover { filter: brightness(1.15); }

/* ===== 加载页 ===== */
#loadingPage {
  display: none;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}
.loading-card { text-align: center; max-width: 500px; }
.loading-spinner {
  width: 48px; height: 48px;
  border: 4px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-card .step { font-size: 15px; margin-bottom: 8px; color: var(--fg); }
.loading-card .detail { font-size: 13px; color: var(--muted); }
.loading-progress { margin-top: 24px; display: flex; justify-content: center; gap: 8px; }
.loading-progress .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); transition: background 0.3s; }
.loading-progress .dot.active { background: var(--accent); }
.loading-progress .dot.done { background: var(--green); }

/* ===== 结果页 ===== */
#resultPage {
  display: none;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* 顶部栏 */
.result-topbar {
  display: flex;
  align-items: center;
  padding: 3px 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  height: 28px;
  width: 100%;
}
.result-topbar .error-msg {
  font-size: 12px;
  color: var(--error-fg);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.btn-close {
  background: none;
  color: var(--muted);
  border: none;
  padding: 2px 6px;
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  opacity: 0.5;
  transition: opacity 0.15s;
  margin-left: auto;
}
.btn-close:hover { opacity: 1; color: var(--fg); }

/* 左右分栏 */
.result-body {
  display: flex;
  height: calc(100vh - 50px);
}

/* ===== 左侧: 代码展示 ===== */
.code-panel {
  flex: 1;
  overflow: auto;
  background: var(--line-bg);
  padding: 0;
  min-width: 0;
}
.code-panel-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 1;
  font-size: 13px;
}
.code-panel-header .frame-label { color: var(--highlight); font-weight: 600; }
.code-panel-header .loc-label { color: var(--green); }
.code-panel-header .file-label { color: var(--muted); margin-left: auto; }
.code-viewport { padding: 0; }
.code-viewport pre {
  padding: 8px 0;
  font-size: 12px;
  line-height: 1.55;
  min-width: fit-content;
}
.code-line { display: flex; white-space: pre; padding: 0 16px; min-height: 19px; }
.code-line:hover { background: rgba(137,180,250,0.06); }
.code-line.target {
  background: var(--highlight);
  color: #1a1a2e;
  font-weight: 700;
}
.code-line-num {
  display: inline-block;
  width: 60px;
  text-align: right;
  padding-right: 14px;
  color: #585b70;
  user-select: none;
  flex-shrink: 0;
}
.code-line.target .code-line-num { color: #1a1a2e; }
.code-line-content { white-space: pre-wrap; word-break: break-all; }
.code-line .arrow-marker {
  color: #e64553;
  font-weight: 700;
  margin-left: 8px;
}

/* ===== 右侧: 帧列表 ===== */
.frame-panel {
  width: 380px;
  min-width: 380px;
  overflow-y: auto;
  background: var(--bg);
  border-left: 1px solid var(--border);
}
.frame-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background 0.12s;
}
.frame-item:hover { background: var(--surface); }
.frame-item.active {
  background: var(--surface);
  border-left: 3px solid var(--accent);
}
.frame-item .idx {
  width: 22px; height: 22px; border-radius: 4px;
  background: var(--accent); color: var(--bg);
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.frame-item .fn {
  color: var(--highlight); font-weight: 600; font-size: 13px;
  word-break: break-all;
  flex: 1; min-width: 0;
}
.frame-item .loc {
  color: var(--link); font-size: 11px;
  word-break: break-all;
  flex-shrink: 1; min-width: 0;
}
.frame-item .offset {
  color: #a6adc8; font-size: 11px; flex-shrink: 0;
}
.frame-item .pretty-loc {
  color: var(--green); font-size: 11px; flex-shrink: 0; margin-left: 4px;
}

/* 语法高亮 */
.hl-keyword  { color: #569cd6; }
.hl-keyword2 { color: #c586c0; }
.hl-type     { color: #4ec9b0; }
.hl-string   { color: #ce9178; }
.hl-number   { color: #b5cea8; }
.hl-comment  { color: #6a9955; }
.hl-property { color: #dcdcaa; }
.hl-fncall   { color: #dcdcaa; }
.hl-var      { color: #9cdcfe; }
.hl-regex    { color: #d16969; }
.code-line.target .hl-keyword  { color: #3c3c9e; }
.code-line.target .hl-keyword2 { color: #8a2a8a; }
.code-line.target .hl-type     { color: #1a8a6a; }
.code-line.target .hl-string   { color: #b8653a; }
.code-line.target .hl-number   { color: #3a8a3a; }
.code-line.target .hl-comment  { color: #3a6a2a; }
.code-line.target .hl-property { color: #9a7a2a; }
.code-line.target .hl-fncall   { color: #9a7a2a; }
.code-line.target .hl-var      { color: #2a6a8a; }

@media (max-width: 900px) { .frame-panel { width: 260px; min-width: 260px; } }
</style>
</head>
<body>

<!-- ====== 输入页 ====== -->
<div id="inputPage">
  <div class="input-card">
    <h1>JS 堆栈解析器</h1>
    <div class="sub">粘贴 JavaScript 错误堆栈，自动解析每一帧对应的源码上下文</div>
    <textarea id="stackInput" placeholder="在此粘贴错误堆栈...">TypeError: String(...).padStart is not a function
    at e.getFormatCountdown (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:882872)
    at t.refreshCountDown (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:123684)
    at t.onFeedingBowlSecond (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:121245)
    at CCClass.209.c.emit (https://game.kg.qq.com/tmegames/pethome_kg/cocos2d-js-min.a27dc.js?tbundle=dll_cocos2:1:638640)
    at Object.emit (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:871132)
    at e.onFeedingBowlSecond (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:184773)
    at CCClass.209.c.emit (https://game.kg.qq.com/tmegames/pethome_kg/cocos2d-js-min.a27dc.js?tbundle=dll_cocos2:1:638640)
    at Object.emit (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:871132)
    at e.onSecond (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:884455)
    at e.set (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:880538)
    at e.onTicker (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:880631)</textarea>
    <button class="btn-parse" onclick="startParse()">🔍 解析堆栈</button>
  </div>
</div>

<!-- ====== 加载页 ====== -->
<div id="loadingPage">
  <div class="loading-card">
    <div class="loading-spinner"></div>
    <div class="step" id="loadStep">初始化...</div>
    <div class="detail" id="loadDetail"></div>
    <div class="loading-progress" id="loadProgress"></div>
  </div>
</div>

<!-- ====== 结果页 ====== -->
<div id="resultPage">
  <!-- 顶部栏 -->
  <div class="result-topbar">
    <div class="error-msg" id="errorMessage"></div>
    <button class="btn-close" onclick="backToInput()" title="关闭">✕</button>
  </div>

  <!-- 左右分栏 -->
  <div class="result-body">
    <!-- 左侧: 代码展示 -->
    <div class="code-panel" id="codePanel">
      <div class="code-panel-header">
        <span class="frame-label" id="codeFrameLabel">#0</span>
        <span class="loc-label" id="codeLocLabel">-</span>
        <span class="file-label" id="codeFileLabel"></span>
      </div>
      <div class="code-viewport" id="codeViewport">
        <div style="padding:40px;text-align:center;color:var(--muted);font-size:14px">
          ⟳ 加载中...
        </div>
      </div>
    </div>

    <!-- 右侧: 帧列表 -->
    <div class="frame-panel" id="framePanel"></div>
  </div>
</div>

<script>
const API_BASE = '/api';
const $ = id => document.getElementById(id);
const CONTEXT_LINES = 100;

let CACHED_FRAMES = [];
let CACHED_SOURCES = {};  // url -> { size, totalLines, fileName, mappedPositions }
let CACHED_ERROR_MSG = '';
let SELECTED_INDEX = 0;

// ===== 工具 =====
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ===== 语法高亮 =====
function highlightJs(code) {
  if (!code) return '';
  const rules = [
    { re: /\/\/.*|\/\*[\s\S]*?\*\//, cls: 'hl-comment' },
    { re: /`(?:[^`$]|\$(?!\{)|\$\{[^}]*\})*`/, cls: 'hl-string' },
    { re: /\/(?:[^\/\\\n]|\\.)+[\/][gimsuy]*/, cls: 'hl-regex' },
    { re: /"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/, cls: 'hl-string' },
    { re: /\b(?:0[xX][0-9a-fA-F]+|0[bB][01]+|0[oO][0-7]+|(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?)\b/, cls: 'hl-number' },
    { re: /\b(?:function|class|new|this|super|async|await|yield|extends|static|get|set)\b/, cls: 'hl-keyword2' },
    { re: /\b(?:if|else|for|while|do|switch|case|break|continue|return|var|let|const|import|export|default|from|as|try|catch|finally|throw|typeof|instanceof|void|delete|in|of|with|module|require|debugger)\b/, cls: 'hl-keyword' },
    { re: /\b(?:String|Number|Boolean|Array|Object|Function|Symbol|BigInt|Map|Set|WeakMap|WeakSet|Promise|Proxy|Reflect|RegExp|Error|Date|Math|JSON|parseInt|parseFloat|isNaN|isFinite|console|undefined|null|NaN|Infinity|globalThis|window|document|Intl|Buffer|process)\b/, cls: 'hl-type' },
    { re: /\.([a-zA-Z_$][\w$]*)/, cls: 'hl-property' },
    { re: /\b([a-zA-Z_$][\w$]*)\s*\(/, cls: 'hl-fncall' },
    { re: /\b([a-zA-Z_$][\w$]*)\b/, cls: 'hl-var' },
    { re: /[+\-*\/%=!<>]=?|&&|\|\||[~&|^?:]/, cls: 'hl-operator' },
    { re: /[(){}[\];,.]/, cls: 'hl-punc' },
  ];
  let html = '';
  let pos = 0;
  while (pos < code.length) {
    let matched = false;
    for (const rule of rules) {
      const re = new RegExp(rule.re.source, 'g');
      re.lastIndex = pos;
      const m = re.exec(code);
      if (m && m.index === pos) {
        const text = m[0];
        const innerText = m[1] || text;
        if (rule.cls === 'hl-fncall') {
          html += `<span class="hl-fncall">${escapeHtml(innerText)}</span><span class="hl-punc">${escapeHtml(text.slice(innerText.length))}</span>`;
        } else if (rule.cls === 'hl-property') {
          html += `<span class="hl-operator">.</span><span class="hl-property">${escapeHtml(innerText)}</span>`;
        } else {
          html += `<span class="${rule.cls}">${escapeHtml(text)}</span>`;
        }
        pos = m.index + text.length;
        matched = true;
        break;
      }
    }
    if (!matched) { html += escapeHtml(code[pos]); pos++; }
  }
  return html;
}

// ===== API =====
async function api(url, data) {
  const resp = await fetch(API_BASE + url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ error: `HTTP ${resp.status}` }));
    throw new Error(err.error || `HTTP ${resp.status}`);
  }
  return resp.json();
}

// ===== 页面切换 =====
function showInput() { $('inputPage').style.display = 'flex'; $('loadingPage').style.display = 'none'; $('resultPage').style.display = 'none'; }
function showLoading() { $('inputPage').style.display = 'none'; $('loadingPage').style.display = 'flex'; $('resultPage').style.display = 'none'; }
function showResult() { $('inputPage').style.display = 'none'; $('loadingPage').style.display = 'none'; $('resultPage').style.display = 'flex'; }
function setLoadStep(step, detail) { $('loadStep').textContent = step; $('loadDetail').textContent = detail || ''; }
function setProgress(current, total) {
  const container = $('loadProgress');
  container.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i < current ? ' done' : i === current ? ' active' : '');
    container.appendChild(dot);
  }
}
function backToInput() { showInput(); }

// ===== 主流程 =====
async function startParse() {
  const stack = $('stackInput').value.trim();
  if (!stack) return;

  showLoading();
  setLoadStep('📋 解析堆栈中...');
  setProgress(0, 3);

  try {
    // 提取错误消息（第一行）
    const firstLine = stack.split('\n').find(l => l.trim());
    CACHED_ERROR_MSG = firstLine ? firstLine.trim() : '';

    // 1. 解析
    const parseData = await api('/parse', { stack });
    CACHED_FRAMES = parseData.frames;
    if (parseData.frames.length === 0) throw new Error('未识别到有效的堆栈帧');
    setProgress(1, 3);

    // 2. 下载 + 美化所有文件
    const uniqueUrls = [...new Set(parseData.frames.map(f => f.url))];
    CACHED_SOURCES = {};

    for (let ui = 0; ui < uniqueUrls.length; ui++) {
      const url = uniqueUrls[ui];
      const fileName = url.split('/').pop().split('?')[0];

      setLoadStep(`⬇️ 下载 [${ui+1}/${uniqueUrls.length}]`, fileName);
      const fetchData = await api('/fetch-source', { url });
      const fileSize = (fetchData.size / 1024 / 1024).toFixed(1);

      setLoadStep(`✨ 美化 [${ui+1}/${uniqueUrls.length}]`, `${fileName} (${fileSize}MB)`);

      const frameOffsets = parseData.frames.filter(f => f.url === url).map(f => f.col);
      const batchResult = await api('/pretty-context-batch', { url, offsets: frameOffsets, contextLines: 0 });

      const mapped = {};
      for (const r of batchResult.results) mapped[r.rawOffset] = r.mappedPosition;

      CACHED_SOURCES[url] = {
        size: fetchData.size,
        totalLines: batchResult.totalLines,
        fileName,
        mappedPositions: mapped,
      };
    }

    setProgress(3, 3);
    setLoadStep('✅ 完成!', '渲染结果...');
    await new Promise(r => setTimeout(r, 300));

    // 显示错误消息
    $('errorMessage').textContent = CACHED_ERROR_MSG;

    SELECTED_INDEX = 0;
    renderFrameList();
    await showFrame(0);
    showResult();
  } catch (e) {
    setLoadStep('❌ 出错了', e.message);
    setTimeout(() => { alert('错误: ' + e.message); showInput(); }, 1500);
  }
}

// ===== 渲染右侧帧列表 =====
function renderFrameList() {
  const panel = $('framePanel');
  panel.innerHTML = '';

  for (let i = 0; i < CACHED_FRAMES.length; i++) {
    const f = CACHED_FRAMES[i];
    const shortUrl = f.url.replace(/^https?:\/\//, '').replace(/\?.*/, '');
    const offsetStr = `${f.line}:${f.col}`;

    const item = document.createElement('div');
    item.className = 'frame-item' + (i === SELECTED_INDEX ? ' active' : '');
    item.dataset.idx = i;

    let prettyHtml = '';
    if (CACHED_SOURCES[f.url] && CACHED_SOURCES[f.url].mappedPositions[f.col]) {
      const pos = CACHED_SOURCES[f.url].mappedPositions[f.col];
      prettyHtml = `<span class="pretty-loc">→ ${pos.prettyLine}</span>`;
    }

    item.innerHTML = `
      <span class="idx">${i}</span>
      <span class="fn" title="${escapeHtml(f.fn)}">${escapeHtml(f.fn)}</span>
      <span class="loc">${escapeHtml(f.url.split('/').pop() || shortUrl)}</span>
      <span class="offset">${offsetStr}</span>
      ${prettyHtml}
    `;

    item.addEventListener('click', () => selectFrame(i));
    panel.appendChild(item);
  }
}

// ===== 选择帧 =====
function selectFrame(idx) {
  if (idx === SELECTED_INDEX) return;
  SELECTED_INDEX = idx;

  // 更新列表高亮
  document.querySelectorAll('.frame-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });

  showFrame(idx);
}

// ===== 显示帧代码 =====
async function showFrame(idx) {
  const f = CACHED_FRAMES[idx];
  const sourceUrl = f.url;

  // 更新头部信息
  $('codeFrameLabel').textContent = `#${idx} ${escapeHtml(f.fn)}`;
  $('codeLocLabel').textContent = `${f.line}:${f.col}`;
  const fileShort = sourceUrl.split('/').pop().split('?')[0];
  $('codeFileLabel').textContent = `📄 ${fileShort}`;

  const viewport = $('codeViewport');

  if (!CACHED_SOURCES[sourceUrl]) {
    viewport.innerHTML = '<div style="padding:40px;text-align:center;color:var(--error-fg)">未加载该文件</div>';
    return;
  }

  // 显示加载状态
  viewport.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)"><div class="loading-spinner" style="width:24px;height:24px;border-width:2px;margin:0 auto 12px"></div>加载代码...</div>';

  try {
    const data = await api('/pretty-context', {
      url: sourceUrl,
      rawOffset: f.col,
      contextLines: CONTEXT_LINES,
    });

    if (!data.mappedPosition) {
      viewport.innerHTML = '<div style="padding:40px;text-align:center;color:var(--error-fg)">映射失败</div>';
      return;
    }

    let html = '<pre>';
    for (const line of data.lines) {
      const cls = line.isTarget ? 'code-line target' : 'code-line';
      const ln = String(line.lineNum).padStart(5);
      const content = highlightJs(line.content);
      const arrow = line.isTarget ? ' <span class="arrow-marker">←</span>' : '';
      html += `<div class="${cls}"><span class="code-line-num">${ln}</span><span class="code-line-content">${content}${arrow}</span></div>`;
    }
    html += '</pre>';

    // 底部信息
    const pos = data.mappedPosition;
    const srcInfo = CACHED_SOURCES[sourceUrl];
    const fn = srcInfo ? srcInfo.fileName : fileShort;
    html += `<div style="padding:6px 16px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);background:var(--surface)">
      📄 ${fn} · 偏移 ${data.rawOffset} → ${pos.prettyLine}:${pos.prettyCol} ${pos.confidence === 'exact' ? '✅' : '⚠️'}
      &nbsp;·&nbsp; 前后各 ${CONTEXT_LINES} 行
    </div>`;

    viewport.innerHTML = html;

    // 滚动到目标行
    const targetEl = viewport.querySelector('.code-line.target');
    if (targetEl) {
      targetEl.scrollIntoView({ block: 'center' });
    }
  } catch (e) {
    viewport.innerHTML = `<div style="padding:40px;text-align:center;color:var(--error-fg)">失败: ${escapeHtml(e.message)}</div>`;
  }
}
</script>
</body>
</html>
