<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS 堆栈解析器</title>
<style>
:root {
  --bg: #1e1e2e;
  --fg: #cdd6f4;
  --accent: #89b4fa;
  --border: #45475a;
  --line-bg: #181825;
  --highlight: #f9e2af;
  --error-fg: #f38ba8;
  --link: #89b4fa;
  --surface: #313244;
  --green: #a6e3a1;
  --muted: #6c7086;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
  background: var(--bg);
  color: var(--fg);
  font-size: 14px;
  min-height: 100vh;
}

/* ===== 初始输入页 ===== */
#inputPage {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}
.input-card {
  width: 100%;
  max-width: 900px;
  background: var(--surface);
  border-radius: 12px;
  padding: 32px;
  border: 1px solid var(--border);
}
.input-card h1 {
  font-size: 22px;
  color: var(--accent);
  margin-bottom: 8px;
}
.input-card .sub {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 20px;
}
.input-card textarea {
  width: 100%;
  height: 300px;
  background: var(--line-bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  font-family: inherit;
  font-size: 13px;
  resize: vertical;
  tab-size: 2;
  line-height: 1.6;
}
.input-card textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(137,180,250,0.2);
}
.btn-parse {
  margin-top: 16px;
  width: 100%;
  padding: 14px;
  font-size: 16px;
  font-weight: 700;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  transition: filter 0.15s;
}
.btn-parse:hover { filter: brightness(1.15); }

/* ===== 加载页 ===== */
#loadingPage {
  display: none;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}
.loading-card {
  text-align: center;
  max-width: 500px;
}
.loading-spinner {
  width: 48px;
  height: 48px;
  border: 4px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-card .step {
  font-size: 15px;
  margin-bottom: 8px;
  color: var(--fg);
}
.loading-card .detail {
  font-size: 13px;
  color: var(--muted);
}
.loading-progress {
  margin-top: 24px;
  display: flex;
  justify-content: center;
  gap: 8px;
}
.loading-progress .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--border);
  transition: background 0.3s;
}
.loading-progress .dot.active { background: var(--accent); }
.loading-progress .dot.done { background: var(--green); }

/* ===== 结果页 ===== */
#resultPage {
  display: none;
  padding: 20px;
  max-width: 1400px;
  margin: 0 auto;
}
.result-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.result-header h2 {
  font-size: 18px;
  color: var(--accent);
}
.result-header .stat {
  font-size: 13px;
  color: var(--muted);
}
.result-header .stat strong { color: var(--fg); }
.result-header .file-badge {
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--surface);
  color: var(--muted);
}
.btn-back {
  background: var(--surface);
  color: var(--fg);
  border: 1px solid var(--border);
  padding: 6px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  margin-left: auto;
}
.btn-back:hover { filter: brightness(1.15); }

/* 帧列表 */
.stack-frames { list-style: none; }
.stack-frame {
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 6px;
  overflow: hidden;
}
.frame-header {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  cursor: pointer;
  background: var(--surface);
  gap: 8px;
  user-select: none;
  transition: background 0.15s;
}
.frame-header:hover { background: #3a3d4e; }
.frame-index {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 4px;
  background: var(--accent);
  color: var(--bg);
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.frame-fn {
  color: var(--highlight);
  font-weight: 600;
  flex-shrink: 0;
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.frame-loc {
  color: var(--link);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
  flex: 1;
}
.frame-offset { color: #a6adc8; font-size: 12px; flex-shrink: 0; }
.frame-pretty-loc { color: var(--green); font-size: 11px; flex-shrink: 0; margin-left: 8px; }
.frame-arrow { color: #a6adc8; font-size: 12px; flex-shrink: 0; margin-left: 4px; }

.frame-code { display: none; overflow-x: auto; background: var(--line-bg); border-top: 1px solid var(--border); }
.frame-code.open { display: block; }
.frame-code pre { padding: 8px 12px; font-size: 12px; line-height: 1.55; min-width: fit-content; margin: 0; }

.code-line { display: flex; white-space: pre; padding: 0 8px; border-radius: 2px; min-height: 19px; }
.code-line:hover { background: rgba(137,180,250,0.08); }
.code-line.target {
  background: var(--highlight);
  color: #1a1a2e;
  font-weight: 700;
  border-radius: 3px;
}
.code-line-num {
  display: inline-block;
  width: 50px;
  text-align: right;
  padding-right: 12px;
  color: #585b70;
  user-select: none;
  flex-shrink: 0;
}
.code-line.target .code-line-num { color: #1a1a2e; }
.code-line-content { white-space: pre-wrap; word-break: break-all; }

/* 语法高亮 */
.hl-keyword  { color: #569cd6; }
.hl-keyword2 { color: #c586c0; }
.hl-type     { color: #4ec9b0; }
.hl-string   { color: #ce9178; }
.hl-number   { color: #b5cea8; }
.hl-comment  { color: #6a9955; }
.hl-property { color: #dcdcaa; }
.hl-fncall   { color: #dcdcaa; }
.hl-var      { color: #9cdcfe; }
.hl-regex    { color: #d16969; }
.code-line.target .hl-keyword  { color: #3c3c9e; }
.code-line.target .hl-keyword2 { color: #8a2a8a; }
.code-line.target .hl-type     { color: #1a8a6a; }
.code-line.target .hl-string   { color: #b8653a; }
.code-line.target .hl-number   { color: #3a8a3a; }
.code-line.target .hl-comment  { color: #3a6a2a; }
.code-line.target .hl-property { color: #9a7a2a; }
.code-line.target .hl-fncall   { color: #9a7a2a; }
.code-line.target .hl-var      { color: #2a6a8a; }

@media (max-width: 800px) { .frame-fn { max-width: 120px; } }
</style>
</head>
<body>

<!-- ====== 初始输入页 ====== -->
<div id="inputPage">
  <div class="input-card">
    <h1>JS 堆栈解析器</h1>
    <div class="sub">粘贴 JavaScript 错误堆栈，解析每一帧对应的源码上下文</div>
    <textarea id="stackInput" placeholder="在此粘贴错误堆栈...&#10;&#10;例如:&#10;TypeError: String(...).padStart is not a function&#10;    at e.getFormatCountdown (https://example.com/app.js:1:882872)&#10;    at t.refreshCountDown (https://example.com/app.js:1:123684)">TypeError: String(...).padStart is not a function
    at e.getFormatCountdown (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:882872)
    at t.refreshCountDown (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:123684)
    at t.onFeedingBowlSecond (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:121245)
    at CCClass.209.c.emit (https://game.kg.qq.com/tmegames/pethome_kg/cocos2d-js-min.a27dc.js?tbundle=dll_cocos2:1:638640)
    at Object.emit (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:871132)
    at e.onFeedingBowlSecond (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:184773)
    at CCClass.209.c.emit (https://game.kg.qq.com/tmegames/pethome_kg/cocos2d-js-min.a27dc.js?tbundle=dll_cocos2:1:638640)
    at Object.emit (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:871132)
    at e.onSecond (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:884455)
    at e.set (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:880538)
    at e.onTicker (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:880631)</textarea>
    <button class="btn-parse" onclick="startParse()">🔍 解析堆栈</button>
  </div>
</div>

<!-- ====== 加载页 ====== -->
<div id="loadingPage">
  <div class="loading-card">
    <div class="loading-spinner"></div>
    <div class="step" id="loadStep">初始化...</div>
    <div class="detail" id="loadDetail"></div>
    <div class="loading-progress" id="loadProgress"></div>
  </div>
</div>

<!-- ====== 结果页 ====== -->
<div id="resultPage">
  <div class="result-header">
    <h2>📋 堆栈帧</h2>
    <span class="stat" id="resultStat"></span>
    <span id="fileBadges"></span>
    <button class="btn-back" onclick="backToInput()">← 返回</button>
  </div>
  <div id="resultOutput"></div>
</div>

<script>
const API_BASE = '/api';
const $ = id => document.getElementById(id);

let CACHED_FRAMES = [];
let CACHED_SOURCES = {}; // url -> { size, totalLines, mappedPositions: { offset -> {prettyLine,prettyCol} } }

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ===== 语法高亮 =====
function highlightJs(code) {
  if (!code) return '';
  const rules = [
    { re: /\/\/.*|\/\*[\s\S]*?\*\//, cls: 'hl-comment' },
    { re: /`(?:[^`$]|\$(?!\{)|\$\{[^}]*\})*`/, cls: 'hl-string' },
    { re: /\/(?:[^\/\\\n]|\\.)+[\/][gimsuy]*/, cls: 'hl-regex' },
    { re: /"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/, cls: 'hl-string' },
    { re: /\b(?:0[xX][0-9a-fA-F]+|0[bB][01]+|0[oO][0-7]+|(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?)\b/, cls: 'hl-number' },
    { re: /\b(?:function|class|new|this|super|async|await|yield|extends|static|get|set)\b/, cls: 'hl-keyword2' },
    { re: /\b(?:if|else|for|while|do|switch|case|break|continue|return|var|let|const|import|export|default|from|as|try|catch|finally|throw|typeof|instanceof|void|delete|in|of|with|module|require|debugger)\b/, cls: 'hl-keyword' },
    { re: /\b(?:String|Number|Boolean|Array|Object|Function|Symbol|BigInt|Map|Set|WeakMap|WeakSet|Promise|Proxy|Reflect|RegExp|Error|Date|Math|JSON|parseInt|parseFloat|isNaN|isFinite|console|undefined|null|NaN|Infinity|globalThis|window|document|Intl|Buffer|process)\b/, cls: 'hl-type' },
    { re: /\.([a-zA-Z_$][\w$]*)/, cls: 'hl-property' },
    { re: /\b([a-zA-Z_$][\w$]*)\s*\(/, cls: 'hl-fncall' },
    { re: /\b([a-zA-Z_$][\w$]*)\b/, cls: 'hl-var' },
    { re: /[+\-*\/%=!<>]=?|&&|\|\||[~&|^?:]/, cls: 'hl-operator' },
    { re: /[(){}[\];,.]/, cls: 'hl-punc' },
  ];
  let html = '';
  let pos = 0;
  while (pos < code.length) {
    let matched = false;
    for (const rule of rules) {
      const re = new RegExp(rule.re.source, 'g');
      re.lastIndex = pos;
      const m = re.exec(code);
      if (m && m.index === pos) {
        const text = m[0];
        const innerText = m[1] || text;
        if (rule.cls === 'hl-fncall') {
          html += `<span class="hl-fncall">${escapeHtml(innerText)}</span><span class="hl-punc">${escapeHtml(text.slice(innerText.length))}</span>`;
        } else if (rule.cls === 'hl-property') {
          html += `<span class="hl-operator">.</span><span class="hl-property">${escapeHtml(innerText)}</span>`;
        } else {
          html += `<span class="${rule.cls}">${escapeHtml(text)}</span>`;
        }
        pos = m.index + text.length;
        matched = true;
        break;
      }
    }
    if (!matched) { html += escapeHtml(code[pos]); pos++; }
  }
  return html;
}

// ===== API =====
async function api(url, data) {
  const resp = await fetch(API_BASE + url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ error: `HTTP ${resp.status}` }));
    throw new Error(err.error || `HTTP ${resp.status}`);
  }
  return resp.json();
}

// ===== 页面切换 =====
function showInput() {
  $('inputPage').style.display = 'flex';
  $('loadingPage').style.display = 'none';
  $('resultPage').style.display = 'none';
}

function showLoading() {
  $('inputPage').style.display = 'none';
  $('loadingPage').style.display = 'flex';
  $('resultPage').style.display = 'none';
}

function showResult() {
  $('inputPage').style.display = 'none';
  $('loadingPage').style.display = 'none';
  $('resultPage').style.display = 'block';
}

function setLoadStep(step, detail) {
  $('loadStep').textContent = step;
  $('loadDetail').textContent = detail || '';
}

function setProgress(current, total) {
  const container = $('loadProgress');
  container.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i < current ? ' done' : i === current ? ' active' : '');
    container.appendChild(dot);
  }
}

function backToInput() {
  showInput();
}

// ===== 主流程 =====
async function startParse() {
  const stack = $('stackInput').value.trim();
  if (!stack) return;

  showLoading();
  setLoadStep('📋 解析堆栈中...');
  setProgress(0, 3);

  try {
    // 1. 解析堆栈
    const parseData = await api('/parse', { stack });
    CACHED_FRAMES = parseData.frames;
    if (parseData.frames.length === 0) {
      throw new Error('未识别到有效的堆栈帧');
    }
    setProgress(1, 3);

    // 2. 收集所有唯一 URL
    const uniqueUrls = [...new Set(parseData.frames.map(f => f.url))];
    CACHED_SOURCES = {};

    // 3. 依次下载 + 美化每个文件
    for (let ui = 0; ui < uniqueUrls.length; ui++) {
      const url = uniqueUrls[ui];
      const fileName = url.split('/').pop().split('?')[0];

      setLoadStep(
        `⬇️ 下载文件 [${ui+1}/${uniqueUrls.length}]`,
        fileName
      );

      const fetchData = await api('/fetch-source', { url });
      const fileSize = (fetchData.size / 1024 / 1024).toFixed(1);

      setLoadStep(
        `✨ 美化代码 [${ui+1}/${uniqueUrls.length}]`,
        `${fileName} (${fileSize}MB)`
      );

      // 找出属于这个 URL 的帧偏移
      const frameOffsets = parseData.frames
        .filter(f => f.url === url)
        .map(f => f.col);

      const batchResult = await api('/pretty-context-batch', {
        url,
        offsets: frameOffsets,
        contextLines: 0,
      });

      const mapped = {};
      for (const r of batchResult.results) {
        mapped[r.rawOffset] = r.mappedPosition;
      }

      CACHED_SOURCES[url] = {
        size: fetchData.size,
        totalLines: batchResult.totalLines,
        fileName,
        mappedPositions: mapped,
      };
    }

    setProgress(3, 3);
    setLoadStep('✅ 完成!', '正在渲染结果...');

    // 短暂延迟让用户看到完成状态
    await new Promise(r => setTimeout(r, 300));
    renderResult();
    showResult();
  } catch (e) {
    setLoadStep('❌ 出错了', e.message);
    setTimeout(() => {
      alert('错误: ' + e.message);
      showInput();
    }, 1500);
  }
}

// ===== 渲染结果 =====
function renderResult() {
  // 统计
  const totalFiles = Object.keys(CACHED_SOURCES).length;
  const totalLines = Object.values(CACHED_SOURCES).reduce((s, v) => s + v.totalLines, 0);
  $('resultStat').textContent = `${CACHED_FRAMES.length} 帧 · ${totalFiles} 文件 · ${totalLines.toLocaleString()} 行`;

  // 文件徽章
  let badges = '';
  for (const [url, src] of Object.entries(CACHED_SOURCES)) {
    const fn = src.fileName || url.split('/').pop().split('?')[0];
    const sizeMB = (src.size / 1024 / 1024).toFixed(1);
    badges += `<span class="file-badge">📄 ${fn} (${sizeMB}MB · ${src.totalLines} 行)</span> `;
  }
  $('fileBadges').innerHTML = badges;

  // 帧列表
  const output = $('resultOutput');
  const contextSize = 100;

  let html = '<div class="stack-frames">';

  for (let i = 0; i < CACHED_FRAMES.length; i++) {
    const f = CACHED_FRAMES[i];
    const shortUrl = f.url.replace(/^https?:\/\//, '').replace(/\?.*/, '');
    const offsetStr = `${f.line}:${f.col}`;

    html += `<div class="stack-frame">`;
    html += `<div class="frame-header" onclick="toggleFrame(${i})">`;
    html += `<span class="frame-index">${i}</span>`;
    html += `<span class="frame-fn" title="${escapeHtml(f.fn)}">${escapeHtml(f.fn)}</span>`;
    html += `<span class="frame-loc" title="${escapeHtml(f.url)}">${escapeHtml(shortUrl)}</span>`;
    html += `<span class="frame-offset">${offsetStr}</span>`;

    if (CACHED_SOURCES[f.url] && CACHED_SOURCES[f.url].mappedPositions[f.col]) {
      const pos = CACHED_SOURCES[f.url].mappedPositions[f.col];
      html += `<span class="frame-pretty-loc">→ ${pos.prettyLine}:${pos.prettyCol}</span>`;
    }

    html += `<span class="frame-arrow" id="arrow-${i}">▶</span>`;
    html += `</div>`;

    html += `<div class="frame-code" id="code-${i}">`;
    html += `<div id="code-content-${i}"><pre><div class="code-line"><span class="code-line-content" style="color:var(--muted);padding:8px">点击展开</span></div></pre></div>`;
    html += `</div></div>`;
  }

  html += '</div>';
  output.innerHTML = html;

  // 自动展开第一帧
  setTimeout(() => toggleFrame(0), 200);
}

// ===== 展开帧 =====
async function toggleFrame(idx) {
  const code = $(`code-${idx}`);
  const arrow = $(`arrow-${idx}`);
  if (!code || !arrow) return;
  const isOpen = code.classList.toggle('open');
  arrow.textContent = isOpen ? '▼' : '▶';

  if (isOpen) {
    await loadContext(idx);
  }
}

async function loadContext(frameIdx) {
  const f = CACHED_FRAMES[frameIdx];
  const container = $(`code-content-${frameIdx}`);
  if (!container) return;

  const sourceUrl = f.url;
  if (!CACHED_SOURCES[sourceUrl]) {
    container.innerHTML = '<pre><div class="code-line"><span class="code-line-content" style="color:var(--error-fg);padding:8px">未加载该文件</span></div></pre>';
    return;
  }

  const contextSize = 100;
  container.innerHTML = '<pre><div class="code-line"><span class="code-line-content" style="color:var(--muted);padding:8px"><span class="loading-spinner" style="width:14px;height:14px;border-width:2px;display:inline-block;margin:0 6px 0 0"></span> 加载中...</span></div></pre>';

  try {
    const data = await api('/pretty-context', {
      url: sourceUrl,
      rawOffset: f.col,
      contextLines: contextSize,
    });

    if (!data.mappedPosition) {
      container.innerHTML = '<pre><div class="code-line"><span class="code-line-content" style="color:var(--error-fg);padding:8px">映射失败</span></div></pre>';
      return;
    }

    let html = '<pre>';
    for (const line of data.lines) {
      const cls = line.isTarget ? 'code-line target' : 'code-line';
      const ln = String(line.lineNum).padStart(5);
      const content = highlightJs(line.content);
      html += `<div class="${cls}"><span class="code-line-num">${ln}</span><span class="code-line-content">${content}${line.isTarget ? ' <span style="color:#e64553;font-weight:700">←</span>' : ''}</span></div>`;
    }
    html += '</pre>';

    const pos = data.mappedPosition;
    const srcInfo = CACHED_SOURCES[sourceUrl];
    const fileLabel = srcInfo ? srcInfo.fileName : sourceUrl.split('/').pop().split('?')[0];
    html += `<div style="padding:4px 12px;font-size:11px;color:var(--muted);border-top:1px solid var(--border)">
      📄 ${fileLabel} · 偏移 ${data.rawOffset} → ${pos.prettyLine}:${pos.prettyCol}
      · ${pos.confidence === 'exact' ? '✅' : '⚠️'}
    </div>`;

    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = `<pre><div class="code-line"><span class="code-line-content" style="color:var(--error-fg);padding:8px">失败: ${escapeHtml(e.message)}</span></div></pre>`;
  }
}
</script>
</body>
</html>
