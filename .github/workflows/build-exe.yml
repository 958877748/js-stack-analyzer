name: 构建 EXE

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 安装依赖
        run: npm install

      - name: 构建 EXE
        run: npm run build

      - name: 上传 EXE 产物
        uses: actions/upload-artifact@v4
        with:
          name: js-stack-analyzer
          path: dist/js-stack-analyzer.exe
          compression-level: 0  # exe 已经是压缩的
