<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS 堆栈解析器</title>
<style>
:root {
  --bg: #1e1e2e;
  --fg: #cdd6f4;
  --accent: #89b4fa;
  --border: #45475a;
  --line-bg: #181825;
  --highlight: #f9e2af;
  --error-fg: #f38ba8;
  --link: #89b4fa;
  --surface: #313244;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
  background: var(--bg);
  color: var(--fg);
  padding: 20px;
  font-size: 14px;
}
h1 { font-size: 20px; margin-bottom: 16px; color: var(--accent); }
.container { max-width: 1200px; margin: 0 auto; }
.input-section { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.input-group { flex: 1; min-width: 300px; }
.input-group label { display: block; margin-bottom: 4px; color: var(--accent); font-size: 13px; }
textarea {
  width: 100%;
  height: 180px;
  background: var(--line-bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  font-family: inherit;
  font-size: 13px;
  resize: vertical;
  tab-size: 2;
}
textarea:focus { outline: none; border-color: var(--accent); }
.btn-row { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
button {
  background: var(--accent);
  color: var(--bg);
  border: none;
  padding: 8px 20px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
button:hover { filter: brightness(1.15); }
button.secondary { background: var(--surface); color: var(--fg); }
.help-text { font-size: 12px; color: #a6adc8; margin-left: 8px; }
#fetchStatus { font-size: 13px; margin-left: 8px; }
.stack-frames { list-style: none; }
.stack-frame {
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 6px;
  overflow: hidden;
}
.frame-header {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  cursor: pointer;
  background: var(--surface);
  gap: 8px;
  user-select: none;
}
.frame-header:hover { filter: brightness(1.1); }
.frame-index {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 4px;
  background: var(--accent);
  color: var(--bg);
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.frame-fn {
  color: var(--highlight);
  font-weight: 600;
  flex-shrink: 0;
}
.frame-loc {
  color: var(--link);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  direction: rtl;
  text-align: left;
}
.frame-offset { color: #a6adc8; font-size: 12px; margin-left: auto; flex-shrink: 0; }
.frame-arrow { color: #a6adc8; font-size: 12px; flex-shrink: 0; }
.frame-code {
  display: none;
  overflow-x: auto;
  background: var(--line-bg);
}
.frame-code.open { display: block; }
.frame-code pre {
  padding: 8px 12px;
  font-size: 12px;
  line-height: 1.55;
  counter-reset: line;
  min-width: fit-content;
}
.code-line {
  display: flex;
  white-space: pre;
  padding: 0 8px;
  border-radius: 2px;
  min-height: 19px;
}
.code-line:hover { background: rgba(137,180,250,0.08); }
.code-line.target {
  background: var(--highlight);
  color: #1e1e2e;
  font-weight: 700;
}
.code-line-num {
  display: inline-block;
  width: 50px;
  text-align: right;
  padding-right: 12px;
  color: #585b70;
  user-select: none;
  flex-shrink: 0;
}
.code-line.target .code-line-num { color: #1e1e2e; }
.code-line-content { white-space: pre-wrap; word-break: break-all; }
.error-badge {
  background: var(--error-fg);
  color: var(--bg);
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 3px;
  margin-left: 6px;
}
</style>
</head>
<body>
<div class="container">
  <h1>JS 堆栈解析器</h1>

  <div class="input-section">
    <div class="input-group">
      <label>堆栈信息 (Stack Trace)</label>
      <textarea id="stackInput" placeholder="粘贴错误堆栈...&#10;例如:&#10;at e.getFormatCountdown (https://...js:1:882872)&#10;at t.refreshCountDown (https://...js:1:123684)">TypeError: String(...).padStart is not a function
    at e.getFormatCountdown (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:882872)
    at t.refreshCountDown (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:123684)
    at t.onFeedingBowlSecond (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:121245)
    at CCClass.209.c.emit (https://game.kg.qq.com/tmegames/pethome_kg/cocos2d-js-min.a27dc.js?tbundle=dll_cocos2:1:638640)
    at Object.emit (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:871132)
    at e.onFeedingBowlSecond (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:184773)
    at CCClass.209.c.emit (https://game.kg.qq.com/tmegames/pethome_kg/cocos2d-js-min.a27dc.js?tbundle=dll_cocos2:1:638640)
    at Object.emit (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:871132)
    at e.onSecond (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:884455)
    at e.set (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:880538)
    at e.onTicker (https://game.kg.qq.com/tmegames/pethome_kg/assets/main/index.615df.js:1:880631)</textarea>
    </div>
    <div class="input-group">
      <label>JS 源代码 (粘贴或从URL加载)</label>
      <textarea id="sourceInput" placeholder="粘贴 JS 源码内容..."></textarea>
    </div>
  </div>

  <div class="btn-row">
    <button onclick="parse()">解析堆栈</button>
    <button class="secondary" onclick="fetchSource()">从URL加载源码</button>
    <span id="fetchStatus"></span>
    <span class="help-text">点击堆栈条目展开查看附近代码 (前后各50行)</span>
    <label style="margin-left:auto;font-size:12px;color:#a6adc8">
      <input type="number" id="contextLines" value="50" min="10" max="500" style="width:60px;background:var(--line-bg);color:var(--fg);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-family:inherit;font-size:12px">
      上下文行数
    </label>
  </div>

  <div id="output"></div>
</div>

<script>
const MIN_LINE_LENGTH = 20; // ignore lines shorter than this when scanning for context

function $(id) { return document.getElementById(id); }

function parseStack(text) {
  const frames = [];
  const lines = text.split('\n');
  // Regex: at <fn> (<url>:<line>:<col>) or at <url>:<line>:<col> or at <fn> (<url>:<line>:<col>:<col>?) 
  const re = /^\s*at\s+(?:(.+?)\s+\()?\s*((?:https?|ftp)[^\s:()]+):(\d+):(\d+)/;
  for (const line of lines) {
    const m = line.match(re);
    if (m) {
      frames.push({
        raw: line.trim(),
        fn: m[1] || '<anonymous>',
        url: m[2],
        line: parseInt(m[3], 10),
        col: parseInt(m[4], 10),
      });
    }
  }
  return frames;
}

function groupByUrl(frames) {
  const groups = {};
  for (const f of frames) {
    if (!groups[f.url]) groups[f.url] = [];
    groups[f.url].push(f);
  }
  return groups;
}

function getLineAt(source, colOffset) {
  // For single-line minified files (line=1), colOffset is character index
  // For multi-line files, we need line number
  // Return the line number that contains the given character offset
  let idx = 0;
  let lineNum = 1;
  while (idx < source.length && idx < colOffset) {
    if (source[idx] === '\n') lineNum++;
    idx++;
  }
  // Now find the start of this line
  let lineStart = colOffset;
  while (lineStart > 0 && source[lineStart - 1] !== '\n') lineStart--;
  let lineEnd = colOffset;
  while (lineEnd < source.length && source[lineEnd] !== '\n') lineEnd++;
  return {
    lineNum,
    line: source.slice(lineStart, lineEnd),
    lineStart,
    lineEnd,
    contextStart: Math.max(0, lineStart - 1), // start of previous char for context
  };
}

function getContext(source, colOffset, contextSize) {
  // Find the line containing colOffset
  let lineStart = colOffset;
  while (lineStart > 0 && source[lineStart - 1] !== '\n') lineStart--;
  let lineEnd = colOffset;
  while (lineEnd < source.length && source[lineEnd] !== '\n') lineEnd++;

  // Count line number
  let lineNum = 1;
  for (let i = 0; i < lineStart; i++) {
    if (source[i] === '\n') lineNum++;
  }

  // Determine context window boundaries
  let ctxStart = lineStart;
  let ctxEnd = lineEnd;
  let ctxStartLine = lineNum;
  let ctxEndLine = lineNum;

  // Go backwards to get context lines
  for (let i = 0; i < contextSize; i++) {
    if (ctxStart <= 0) break;
    ctxStart--;
    if (source[ctxStart] === '\n') {
      ctxStartLine--;
    }
    // move to start of this line
    while (ctxStart > 0 && source[ctxStart - 1] !== '\n') ctxStart--;
  }
  // If we went past the start, adjust
  if (ctxStart > 0) {
    ctxStart = 0;
    ctxStartLine = 1;
  } else {
    ctxStart = 0;
    ctxStartLine = 1;
  }

  // Go forwards
  for (let i = 0; i < contextSize; i++) {
    const nextNewline = source.indexOf('\n', ctxEnd + 1);
    if (nextNewline === -1) {
      ctxEnd = source.length;
      break;
    }
    ctxEnd = nextNewline + 1;
    ctxEndLine++;
    // Check if we've consumed the entire source
    if (ctxEnd >= source.length) { ctxEnd = source.length; break; }
  }

  if (ctxEnd > source.length) ctxEnd = source.length;

  // Build lines array
  const lines = [];
  let pos = ctxStart;
  let currentLineNum = ctxStartLine;
  while (pos < ctxEnd) {
    const nl = source.indexOf('\n', pos);
    const lineEndPos = nl === -1 ? ctxEnd : nl;
    const content = source.slice(pos, lineEndPos);
    const isTarget = pos <= lineStart && lineEnd <= lineEndPos;
    // Actually check if this is the exact target line
    const isExactTarget = pos === lineStart || (lineStart > pos && lineStart < lineEndPos && lineStart >= pos);
    // Better: the target line is the one containing the original offset
    const isTargetLine = pos <= colOffset && (nl === -1 || colOffset < nl);
    lines.push({
      lineNum: currentLineNum,
      content,
      isTarget: isTargetLine,
      start: pos,
      end: lineEndPos,
    });
    pos = nl === -1 ? ctxEnd : nl + 1;
    currentLineNum++;
  }

  return lines;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function render() {
  const stackText = $('stackInput').value;
  const source = $('sourceInput').value;
  const contextSize = parseInt($('contextLines').value, 10) || 50;
  const output = $('output');

  const frames = parseStack(stackText);
  if (frames.length === 0) {
    output.innerHTML = '<p style="color:var(--error-fg)">未识别到有效的堆栈帧。请检查格式是否为 <code>at fn (url:line:col)</code></p>';
    return;
  }

  // Group by URL so we can process each file once
  const groups = groupByUrl(frames);

  let html = `<p style="margin-bottom:12px;color:#a6adc8">识别到 ${frames.length} 个堆栈帧</p>`;
  html += '<div class="stack-frames">';

  for (let i = 0; i < frames.length; i++) {
    const f = frames[i];
    const ctxLines = getContext(source, f.col - 1, contextSize);

    const shortUrl = f.url.replace(/^https?:\/\//, '').replace(/\?.*/, '');
    const offsetStr = `${f.line}:${f.col}`;

    html += `<div class="stack-frame">`;
    html += `<div class="frame-header" onclick="toggleFrame(${i})">`;
    html += `<span class="frame-index">${i}</span>`;
    html += `<span class="frame-fn">${escapeHtml(f.fn)}</span>`;
    if (f.url) html += `<span class="frame-loc">${escapeHtml(shortUrl)}</span>`;
    html += `<span class="frame-offset">${offsetStr}</span>`;
    html += `<span class="frame-arrow" id="arrow-${i}">&#9660;</span>`;
    html += `</div>`;
    html += `<div class="frame-code" id="code-${i}">`;
    html += `<pre>`;
    for (const line of ctxLines) {
      const cls = line.isTarget ? 'code-line target' : 'code-line';
      const marker = line.isTarget ? ' ←' : '';
      const ln = String(line.lineNum).padStart(5);
      html += `<div class="${cls}"><span class="code-line-num">${ln}</span><span class="code-line-content">${escapeHtml(line.content)}${line.isTarget ? '<span style="color:#e64553;font-weight:700">  ←</span>' : ''}</span></div>`;
    }
    if (ctxLines.length === 0) {
      html += `<div class="code-line"><span class="code-line-content" style="color:#a6adc8">(请粘贴源码后重新解析)</span></div>`;
    }
    html += `</pre>`;
    html += `</div>`;
    html += `</div>`;
  }

  html += '</div>';
  output.innerHTML = html;

  // Auto-open first frame
  if (frames.length > 0) toggleFrame(0);
}

function toggleFrame(idx) {
  const code = $(`code-${idx}`);
  const arrow = $(`arrow-${idx}`);
  if (!code || !arrow) return;
  const isOpen = code.classList.toggle('open');
  arrow.innerHTML = isOpen ? '&#9660;' : '&#9654;';
}

function parse() {
  render();
}

async function fetchSource() {
  const status = $('fetchStatus');
  // Extract URLs from the stack
  const stackText = $('stackInput').value;
  const frames = parseStack(stackText);
  if (frames.length === 0) {
    status.textContent = '堆栈中未找到URL';
    return;
  }
  // Get unique URLs that look like JS files
  const urls = [...new Set(frames.map(f => f.url))];
  // Prefer the main game file (index.xxx.js) over cocos2d
  const mainUrl = urls.find(u => u.includes('index.')) || urls[0];
  if (!mainUrl) {
    status.textContent = '未找到有效的JS URL';
    return;
  }
  status.textContent = '正在下载: ' + mainUrl.replace(/^https?:\/\//, '').substring(0, 60) + '...';
  try {
    const resp = await fetch(mainUrl, { mode: 'cors' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();
    $('sourceInput').value = text;
    status.textContent = `已下载 ${(text.length / 1024 / 1024).toFixed(1)}MB (${mainUrl.split('/').pop()})`;
    render();
  } catch (e) {
    status.textContent = '下载失败: ' + e.message + ' (可能由于跨域限制，请手动粘贴源码)';
  }
}

// Auto-parse on load with default data
parse();
</script>
</body>
</html>
